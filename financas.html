<style>
  *{box-sizing:border-box}html,body{margin:0;min-height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#eef2f6;color:#1f2a37}
  header{background:linear-gradient(135deg,#1f5fae,#16467f);color:#fff;padding:20px 24px 0;position:sticky;top:0;z-index:50;box-shadow:0 2px 14px rgba(16,24,40,.12)}
  .htop{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .htop .back{color:#dbe7fb;text-decoration:none;font-size:13px;font-weight:600}
  header h1{margin:0;font-size:20px;font-weight:800;flex:1}
  .syncbadge{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.18);color:#eaf2ff}
  .syncbadge.ok{background:#16a34a}.syncbadge.saving{background:#d97706}.syncbadge.err{background:#dc2626}.syncbadge.off{background:#64748b}
  .tabs{display:flex;gap:4px;margin-top:16px}
  .tab{background:transparent;border:none;color:#cfe0f7;font-size:14px;font-weight:700;padding:11px 18px;cursor:pointer;border-bottom:3px solid transparent}
  .tab.on{color:#fff;border-bottom-color:#fff}
  main{max-width:1160px;margin:0 auto;padding:22px 18px 60px}
  .row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
  select,input{font-family:inherit;font-size:14px;padding:9px 11px;border:1px solid #d3dbe6;border-radius:10px;background:#fff;color:#1f2a37}
  select:focus,input:focus{outline:none;border-color:#1f5fae}
  label.fl{font-size:12px;font-weight:700;color:#6b7785;display:block;margin-bottom:5px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
  .kpi{background:#fff;border:1px solid #e3e8ee;border-radius:16px;padding:18px 20px;box-shadow:0 4px 16px rgba(16,24,40,.06)}
  .kpi .lab{font-size:12px;font-weight:700;color:#6b7785;text-transform:uppercase;letter-spacing:.4px}
  .kpi .val{font-size:26px;font-weight:800;margin-top:6px}
  .kpi .sub{font-size:12px;color:#8a97a6;margin-top:3px}
  .kpi.lucro .val{color:#15803d}.kpi.com .val{color:#1f5fae}.kpi.custo .val{color:#c2710c}.kpi.imp .val{color:#dc2626}.kpi.pro .val{color:#7c3aed}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
  .panel{background:#fff;border:1px solid #e3e8ee;border-radius:16px;padding:18px 20px;box-shadow:0 4px 16px rgba(16,24,40,.06)}
  .panel h3{margin:0 0 12px;font-size:14px;font-weight:800;color:#334155}
  .panel .cw{position:relative;height:280px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:8px 9px;text-align:right;border-bottom:1px solid #eef2f6}
  th{background:#f7f9fc;font-weight:700;color:#475569;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;position:sticky;top:0}
  th:first-child,td:first-child{text-align:left}
  tr:hover td{background:#f9fbfe}
  .pos{color:#15803d;font-weight:700}.neg{color:#dc2626;font-weight:700}
  .lgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:820px){.lgrid{grid-template-columns:1fr}}
  .box{background:#fff;border:1px solid #e3e8ee;border-radius:16px;padding:18px 20px}
  .box.ent{border-top:4px solid #15803d}.box.sai{border-top:4px solid #c2710c}
  .box h3{margin:0 0 4px;font-size:15px;font-weight:800}
  .box .bsub{font-size:12px;color:#8a97a6;margin-bottom:14px}
  .fline{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .fline .nm{flex:1;font-size:13.5px;font-weight:600}
  .fline input{width:130px;text-align:right}
  .subtot{display:flex;justify-content:space-between;border-top:2px solid #eef2f6;margin-top:10px;padding-top:10px;font-weight:800;font-size:15px}
  .resumo{background:linear-gradient(135deg,#1f5fae,#16467f);color:#fff;border-radius:16px;padding:20px 22px;margin-top:16px}
  .resumo .rr{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;border-bottom:1px solid rgba(255,255,255,.12)}
  .resumo .rr.big{font-size:19px;font-weight:800;border-bottom:none;margin-top:6px}
  .resumo .rr .g{color:#8fe3b0}
  .hint{font-size:12.5px;color:#8a97a6;background:#f7f9fc;border:1px dashed #d3dbe6;border-radius:10px;padding:10px 12px;margin-top:14px}
  .mono{font-variant-numeric:tabular-nums}
</style>

const MARCAS=["VONDER","MACCAFERRI","LAHUMAN","NEWFIX","MULTFITAS"];
const BRAND_COLORS={VONDER:"#1f5fae",MACCAFERRI:"#c2710c",LAHUMAN:"#7a3aae",NEWFIX:"#15803d",MULTFITAS:"#0891b2",METAW:"#0e7490",ELGIN:"#db2777",EXTRAS:"#94a3b8",OUTRAS:"#94a3b8"};

           var:["Gasolina","Alimentação","Hospedagem","Pedágio","CORE","Outros"],

const MPT=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
const fmt=v=>(v||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt0=v=>Math.round(v||0).toLocaleString("pt-BR");
const mLabel=m=>{const[y,mm]=m.split("-");return MPT[+mm-1]+"/"+y.slice(2);};
const kfmt=v=>{v=Math.round(v||0);const a=Math.abs(v);if(a>=1000)return (v/1000).toFixed(a<10000?1:0).replace(".",",")+"k";return String(v);};
const CAT_COLORS={"Impostos":"#dc2626","Pró-labore":"#7c3aed","Gasolina":"#c2710c","Alimentação":"#16a34a","Hospedagem":"#0891b2","Contador":"#2563eb","Celular":"#db2777","Software/Sistemas":"#0d9488","Notebooks":"#64748b","CORE":"#a16207","Pedágio":"#f59e0b","Seguro":"#4b5563","Carro":"#334155","Outros":"#94a3b8"};

let DB=null,view="dash";
function blankDB(){return {v:1,updated_at:0,meses:{}};}
function migrate(d){const b=blankDB();return Object.assign(b,d||{},{meses:(d&&d.meses)||{}});}

/* ---- agregação por mês (histórico OU lançamento) ---- */
function allMonths(){const s=new Set(Object.keys(HIST_M));Object.keys(DB.meses||{}).forEach(m=>s.add(m));return[...s].sort();}
function aggFor(m){
  const L=DB.meses&&DB.meses[m];
  if(L){
    let com=0,brands={};(L.entradas||[]).forEach(e=>{com+=(+e.valor||0);const k=(e.marca||"OUTRAS").toUpperCase();brands[k]=(brands[k]||0)+(+e.valor||0);});
    let fixo=0,vr=0,imp=0;(L.saidas||[]).forEach(s=>{const v=+s.valor||0;if(s.cat==="fixo")fixo+=v;else if(s.cat==="var")vr+=v;else if(s.cat==="imposto")imp+=v;});
    const pro=+L.prolabore||0, si=+L.saldo_inicial||0;
    const custoReal=fixo+vr+imp;
    return {com,fixo,var:vr,imp,pro,si,custoReal,lpa:com-custoReal,brands,fonte:"lanc"};
  }
  const h=HIST_M[m];if(!h)return null;
  const custoReal=h[1]+h[2]+h[3];
  return {com:h[0],fixo:h[1],var:h[2],imp:h[3],pro:h[4],si:0,custoReal,lpa:h[0]-custoReal,brands:HIST_B[m]||{},fonte:"hist"};
}
function jsCat(item,cat){const n=(item||"").toUpperCase();if(cat==="imposto")return "Impostos";
  if(n.includes("GASOLINA"))return "Gasolina";if(n.includes("ALIMENTA"))return "Alimentação";
  if(n.includes("HOSPEDAGEM"))return "Hospedagem";if(n.includes("PEDAGIO")||n.includes("PEDÁGIO"))return "Pedágio";
  if(n.includes("CELULAR")||n.includes("TELEFONE"))return "Celular";if(n.includes("CONTADOR"))return "Contador";
  if(n.includes("NOTEBOOK"))return "Notebooks";if(n.includes("CORE"))return "CORE";
  if(["MERCOS","UMBLER","TGB","NOTA CONTROL","OFFICE"].some(k=>n.includes(k)))return "Software/Sistemas";
  return "Outros";}
function custosDetalhe(m){const L=DB.meses&&DB.meses[m];
  if(L){const o={};(L.saidas||[]).forEach(s=>{const c=jsCat(s.item,s.cat);o[c]=(o[c]||0)+(+s.valor||0);});const p=+L.prolabore||0;if(p)o["Pró-labore"]=(o["Pró-labore"]||0)+p;return o;}
  return HIST_C[m]||{};}

/* ================= DASHBOARD ================= */
let charts={};
function destroyCharts(){Object.values(charts).forEach(c=>{try{c.destroy();}catch(e){}});charts={};}
function dashPresetRange(p){const AM=allMonths();
  if(p==="all")return[AM[0],AM[AM.length-1]];
  if(p==="12m")return[AM[Math.max(0,AM.length-12)],AM[AM.length-1]];
  if(p==="6m")return[AM[Math.max(0,AM.length-6)],AM[AM.length-1]];
  const ys=AM.filter(m=>m.startsWith(p));return ys.length?[ys[0],ys[ys.length-1]]:[AM[0],AM[AM.length-1]];}
function dashSetPreset(v){if(v==="custom")return;const r=dashPresetRange(v);window._dashFrom=r[0];window._dashTo=r[1];renderDash();}
function dashSetFrom(v){window._dashFrom=v;if(window._dashTo&&v>window._dashTo)window._dashTo=v;renderDash();}
function dashSetTo(v){window._dashTo=v;if(window._dashFrom&&v<window._dashFrom)window._dashFrom=v;renderDash();}
function renderDash(){
  const el=document.getElementById("v-dash");
  if(window.ChartDataLabels&&!window._dlReg){Chart.register(window.ChartDataLabels);window._dlReg=true;}
  const AM=allMonths();
  let from=window._dashFrom,to=window._dashTo;
  if(!from||!to||AM.indexOf(from)<0||AM.indexOf(to)<0){const r=dashPresetRange("12m");from=r[0];to=r[1];}
  if(from>to){const t=from;from=to;to=t;}
  window._dashFrom=from;window._dashTo=to;
  const anos=[...new Set(AM.map(m=>m.slice(0,4)))].sort();
  const presets=[["12m","Últimos 12 meses"],["6m","Últimos 6 meses"],["all","Todo o histórico"],...anos.map(a=>[a,a])];
  const curPreset=(()=>{for(const p of presets){const r=dashPresetRange(p[0]);if(r[0]===from&&r[1]===to)return p[0];}return"custom";})();
  const mopts=s=>AM.map(m=>`<option value="${m}"${m===s?" selected":""}>${mLabel(m)}</option>`).join("");
  el.innerHTML=`
    <div class="row">
      <div><label class="fl">Período</label>
      <select onchange="dashSetPreset(this.value)">
        ${presets.map(p=>`<option value="${p[0]}"${p[0]===curPreset?" selected":""}>${p[1]}</option>`).join("")}
        <option value="custom"${curPreset==="custom"?" selected":""}>Personalizado</option>
      </select></div>
      <div><label class="fl">De</label>
      <select onchange="dashSetFrom(this.value)">${mopts(from)}</select></div>
      <div><label class="fl">Até</label>
      <select onchange="dashSetTo(this.value)">${mopts(to)}</select></div>
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="grid2">
      <div class="panel"><h3>Comissões e Lucro (LPA) por mês</h3><div class="cw"><canvas id="cMes"></canvas></div></div>
      <div class="panel"><h3>Mix de comissões por marca</h3><div class="cw"><canvas id="cMix"></canvas></div></div>
      <div class="panel"><h3>Custos por categoria (período)</h3><div class="cw"><canvas id="cCat"></canvas></div></div>
      <div class="panel"><h3>Evolução dos custos por categoria</h3><div class="cw"><canvas id="cCatMes"></canvas></div></div>
      <div class="panel"><h3>Pró-labore por sócio (por mês)</h3><div class="cw"><canvas id="cPro"></canvas></div></div>
      <div class="panel"><h3>Comissões por ano</h3><div class="cw"><canvas id="cAno"></canvas></div></div>
    </div>`;
  let months=AM.filter(m=>m>=from&&m<=to);
  const A=months.map(m=>({m,...aggFor(m)})).filter(x=>x.com!==undefined);
  const tCom=A.reduce((s,x)=>s+x.com,0),tLpa=A.reduce((s,x)=>s+x.lpa,0),tCusto=A.reduce((s,x)=>s+x.custoReal,0),tImp=A.reduce((s,x)=>s+x.imp,0);
  const marg=tCom?tLpa/tCom*100:0;
  const tPro=A.reduce((s,x)=>s+(x.pro||0),0);
  document.getElementById("kpis").innerHTML=`
    <div class="kpi com"><div class="lab">Comissões</div><div class="val mono">R$ ${fmt0(tCom)}</div><div class="sub">${A.length} meses</div></div>
    <div class="kpi lucro"><div class="lab">Lucro (LPA)</div><div class="val mono">R$ ${fmt0(tLpa)}</div><div class="sub">margem ${marg.toFixed(0)}%</div></div>
    <div class="kpi custo"><div class="lab">Custo real</div><div class="val mono">R$ ${fmt0(tCusto)}</div><div class="sub">${tCom?(tCusto/tCom*100).toFixed(0):0}% da comissão</div></div>
    <div class="kpi imp"><div class="lab">Impostos</div><div class="val mono">R$ ${fmt0(tImp)}</div><div class="sub">${tCom?(tImp/tCom*100).toFixed(0):0}% da comissão</div></div>
    <div class="kpi pro"><div class="lab">Pró-labore</div><div class="val mono">R$ ${fmt0(tPro)}</div><div class="sub">Chris R$ ${fmt0(tPro*0.6)} • Val R$ ${fmt0(tPro*0.4)}</div></div>`;
  destroyCharts();
  const lbl=A.map(x=>mLabel(x.m));
  const step=Math.max(1,Math.ceil(A.length/14)), showI=i=>i%step===0||i===A.length-1;
  charts.cMes=new Chart(document.getElementById("cMes"),{data:{labels:lbl,datasets:[
      {type:"bar",label:"Comissões",data:A.map(x=>x.com),backgroundColor:"#bcd4f2",order:2,
        datalabels:{display:ctx=>showI(ctx.dataIndex)&&ctx.dataset.data[ctx.dataIndex]>0,anchor:"end",align:"end",rotation:A.length>8?-90:0,color:"#1f5fae",font:{size:9,weight:"bold"},formatter:v=>kfmt(v)}},
      {type:"line",label:"LPA",data:A.map(x=>x.lpa),borderColor:"#15803d",backgroundColor:"#15803d",tension:.3,order:1,pointRadius:2,
        datalabels:{display:ctx=>showI(ctx.dataIndex),anchor:"start",align:"bottom",color:"#15803d",font:{size:9,weight:"bold"},formatter:v=>kfmt(v)}}]},
    options:baseOpt()});
  const bt={};A.forEach(x=>{Object.entries(x.brands||{}).forEach(([k,v])=>{const kk=MARCAS.includes(k)?k:"OUTRAS";bt[kk]=(bt[kk]||0)+v;});});
  const bk=Object.keys(bt).sort((a,b)=>bt[b]-bt[a]);
  charts.cMix=new Chart(document.getElementById("cMix"),{type:"doughnut",data:{labels:bk,datasets:[{data:bk.map(k=>bt[k]),backgroundColor:bk.map(k=>BRAND_COLORS[k]||"#94a3b8"),borderWidth:2,borderColor:"#fff"}]},
    options:{responsive:true,maintainAspectRatio:false,layout:{padding:6},plugins:{legend:{position:"right",labels:{font:{size:12}}},
      datalabels:{color:"#fff",font:{size:11,weight:"bold"},textAlign:"center",formatter:(v)=>{const p=tCom?v/tCom*100:0;return p>=7?kfmt(v)+"\n"+p.toFixed(0)+"%":(p>=3?p.toFixed(0)+"%":"");}},
      tooltip:{callbacks:{label:c=>c.label+": R$ "+fmt0(c.parsed)+" ("+(c.parsed/tCom*100).toFixed(0)+"%)"}}}}});
  const catTot={};A.forEach(x=>{const d=custosDetalhe(x.m);Object.entries(d).forEach(([c,v])=>{if(c==="Pró-labore")return;catTot[c]=(catTot[c]||0)+v;});});
  const catKeys=Object.keys(catTot).sort((a,b)=>catTot[b]-catTot[a]);
  charts.cCat=new Chart(document.getElementById("cCat"),{type:"bar",data:{labels:catKeys,datasets:[{label:"Custo",data:catKeys.map(k=>catTot[k]),backgroundColor:catKeys.map(k=>CAT_COLORS[k]||"#94a3b8"),borderRadius:5}]},
    options:{indexAxis:"y",responsive:true,maintainAspectRatio:false,layout:{padding:{right:48}},plugins:{legend:{display:false},
      datalabels:{anchor:"end",align:"end",color:"#334155",font:{size:10,weight:"bold"},formatter:v=>"R$ "+kfmt(v)},
      tooltip:{callbacks:{label:c=>"R$ "+fmt0(c.parsed.x)}}},scales:{x:{grace:"12%",ticks:{callback:v=>"R$ "+kfmt(v)}}}}});
  const topCats=catKeys.slice(0,6), hasOut=catKeys.length>6;
  const stackCats=[...topCats]; if(hasOut)stackCats.push("Outros +");
  const dsCat=stackCats.map(c=>({label:c,stack:"s",backgroundColor:CAT_COLORS[c.replace(" +","")]||"#94a3b8",
    data:A.map(x=>{const d=custosDetalhe(x.m);if(c==="Outros +"){let s=0;Object.entries(d).forEach(([k,v])=>{if(k!=="Pró-labore"&&!topCats.includes(k))s+=v;});return s;}return d[c]||0;}),
    datalabels:{display:ctx=>A.length<=13&&ctx.dataset.data[ctx.dataIndex]>=1500,color:"#fff",font:{size:8,weight:"bold"},formatter:v=>kfmt(v)}}));
  charts.cCatMes=new Chart(document.getElementById("cCatMes"),{type:"bar",data:{labels:lbl,datasets:dsCat},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{font:{size:10},boxWidth:12}},tooltip:{callbacks:{label:c=>c.dataset.label+": R$ "+fmt0(c.parsed.y)}}},scales:{x:{stacked:true},y:{stacked:true,ticks:{callback:v=>"R$ "+kfmt(v)}}}}});
  charts.cPro=new Chart(document.getElementById("cPro"),{type:"bar",data:{labels:lbl,datasets:[
      {label:"Christopher (60%)",data:A.map(x=>(x.pro||0)*0.6),backgroundColor:"#2563eb",stack:"p",
        datalabels:{display:ctx=>showI(ctx.dataIndex)&&ctx.dataset.data[ctx.dataIndex]>0,color:"#fff",font:{size:8,weight:"bold"},formatter:v=>kfmt(v)}},
      {label:"Valdicéia (40%)",data:A.map(x=>(x.pro||0)*0.4),backgroundColor:"#7c3aed",stack:"p",
        datalabels:{display:ctx=>showI(ctx.dataIndex)&&ctx.dataset.data[ctx.dataIndex]>0,color:"#fff",font:{size:8,weight:"bold"},formatter:v=>kfmt(v)}}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{font:{size:11}}},tooltip:{callbacks:{label:c=>c.dataset.label+": R$ "+fmt0(c.parsed.y)}}},scales:{x:{stacked:true},y:{stacked:true,ticks:{callback:v=>"R$ "+kfmt(v)}}}}});
  const yr={};allMonths().forEach(m=>{const y=m.slice(0,4);const a=aggFor(m);if(a){yr[y]=(yr[y]||0)+a.com;}});
  const yk=Object.keys(yr).sort();
  charts.cAno=new Chart(document.getElementById("cAno"),{type:"bar",data:{labels:yk,datasets:[{label:"Comissões",data:yk.map(k=>yr[k]),backgroundColor:"#1f5fae",borderRadius:6,
      datalabels:{anchor:"end",align:"end",color:"#16467f",font:{size:11,weight:"bold"},formatter:v=>"R$ "+kfmt(v)}}]},options:baseOpt(true)});
}
function baseOpt(noLeg){return {responsive:true,maintainAspectRatio:false,layout:{padding:{top:20}},plugins:{legend:{display:!noLeg,position:"bottom"},tooltip:{callbacks:{label:c=>c.dataset.label+": R$ "+fmt0(c.parsed.y)}}},scales:{y:{grace:"16%",ticks:{callback:v=>"R$ "+kfmt(v)}}}};}

/* ================= LANÇAMENTOS ================= */
function ensureMonth(m){if(!DB.meses[m]){
  const h=HIST_M[m];const hb=HIST_B[m]||{};
  const ent=Object.entries(hb).map(([k,v])=>({marca:MARCAS.includes(k)?k:k,valor:v}));
  let sa=[];
  if(h){ if(h[1])sa.push({cat:"fixo",item:"Outro fixo",valor:h[1]});
         if(h[2])sa.push({cat:"var",item:"Outros",valor:h[2]});
         if(h[3])sa.push({cat:"imposto",item:"Simples / Impostos",valor:h[3]}); }
  DB.meses[m]={entradas:ent.length?ent:MARCAS.map(k=>({marca:k,valor:0})),saidas:sa,prolabore:h?h[4]:0,saldo_inicial:0};
}return DB.meses[m];}
function renderLanc(){
  const el=document.getElementById("v-lanc");
  const months=[];const now=new Date();for(let i=0;i<18;i++){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"));}
  allMonths().forEach(m=>{if(!months.includes(m))months.push(m);});
  months.sort().reverse();
  const cur=window._lancM||months.find(m=>DB.meses[m])||months[0];
  window._lancM=cur;
  const L=ensureMonth(cur);
  const marcas=[...new Set([...MARCAS,...(L.entradas||[]).map(e=>e.marca)])];
  const entMap={};(L.entradas||[]).forEach(e=>entMap[e.marca]=e.valor);
  const com=(L.entradas||[]).reduce((s,e)=>s+(+e.valor||0),0);
  let fixo=0,vr=0,imp=0;(L.saidas||[]).forEach(s=>{const v=+s.valor||0;if(s.cat==="fixo")fixo+=v;else if(s.cat==="var")vr+=v;else imp+=v;});
  const custoReal=fixo+vr+imp,pro=+L.prolabore||0,si=+L.saldo_inicial||0;
  const lpa=com-custoReal, caixa=com+si-custoReal-pro;
  const saidasBy=c=>(L.saidas||[]).map((s,i)=>({...s,_i:i})).filter(s=>s.cat===c);
  const saiRows=(c)=>{const rows=saidasBy(c);const items=CAT[c];
    return items.map(it=>{const found=rows.find(r=>r.item===it);const val=found?found.valor:"";
      return `<div class="fline"><span class="nm">${it}</span><input type="number" step="0.01" placeholder="0,00" value="${val}" oninput="setSaida('${cur}','${c}','${it.replace(/'/g,"")}',this.value)"></div>`;}).join("");};
  el.innerHTML=`
    <div class="row">
      <div><label class="fl">Mês de referência</label>
        <select id="lancM" onchange="window._lancM=this.value;renderLanc()">
          ${months.map(m=>`<option value="${m}">${mLabel(m)}${DB.meses[m]&&aggFor(m).fonte==="lanc"?" ✎":""}</option>`).join("")}
        </select></div>
      <div><label class="fl">Saldo inicial (caixa mês anterior)</label>
        <input type="number" step="0.01" value="${si||""}" placeholder="0,00" oninput="setField('${cur}','saldo_inicial',this.value)"></div>
    </div>
    <div class="lgrid">
      <div class="box ent">
        <h3>Entradas — comissões</h3><div class="bsub">Valor recebido por marca no mês</div>
        ${marcas.map(mk=>`<div class="fline"><span class="nm">${mk}</span><input type="number" step="0.01" placeholder="0,00" value="${entMap[mk]!==undefined&&entMap[mk]!==0?entMap[mk]:""}" oninput="setEntrada('${cur}','${mk}',this.value)"></div>`).join("")}
        <div class="fline"><input placeholder="+ outra marca / extra" id="newMarca" style="flex:1;width:auto"><button onclick="addMarca('${cur}')" style="padding:8px 12px;border:none;border-radius:9px;background:#15803d;color:#fff;font-weight:700;cursor:pointer">Add</button></div>
        <div class="subtot"><span>Total comissões</span><span class="pos mono">R$ ${fmt(com)}</span></div>
      </div>
      <div class="box sai">
        <h3>Saídas</h3><div class="bsub">Custos fixos, variáveis e impostos</div>
        <label class="fl" style="margin-top:4px">Fixos</label>${saiRows("fixo")}
        <label class="fl" style="margin-top:10px">Variáveis</label>${saiRows("var")}
        <label class="fl" style="margin-top:10px">Impostos</label>${saiRows("imposto")}
        <div class="subtot"><span>Custo real (sem pró-labore)</span><span class="neg mono">R$ ${fmt(custoReal)}</span></div>
      </div>
    </div>
    <div class="lgrid" style="margin-top:16px">
      <div class="box">
        <h3>Pró-labore</h3><div class="bsub">Distribuição sócios (60/40)</div>
        <div class="fline"><span class="nm">Total a distribuir</span><input type="number" step="0.01" value="${pro||""}" placeholder="0,00" oninput="setField('${cur}','prolabore',this.value)"></div>
        <div class="fline"><span class="nm">Christopher (60%)</span><span class="mono" style="font-weight:700">R$ ${fmt(pro*0.6)}</span></div>
        <div class="fline"><span class="nm">Valdicéia (40%)</span><span class="mono" style="font-weight:700">R$ ${fmt(pro*0.4)}</span></div>
      </div>
      <div class="resumo">
        <div class="rr"><span>Comissões</span><span class="mono">R$ ${fmt(com)}</span></div>
        <div class="rr"><span>Saldo inicial</span><span class="mono">R$ ${fmt(si)}</span></div>
        <div class="rr"><span>(−) Custo real</span><span class="mono">R$ ${fmt(custoReal)}</span></div>
        <div class="rr"><span>(−) Pró-labore</span><span class="mono">R$ ${fmt(pro)}</span></div>
        <div class="rr big"><span>Lucro (LPA)</span><span class="g mono">R$ ${fmt(lpa)}</span></div>
        <div class="rr big"><span>Em caixa</span><span class="mono">R$ ${fmt(caixa)}</span></div>
      </div>
    </div>
    <div class="hint">Dica: os meses já preenchidos vêm do histórico e podem ser ajustados. Em breve você vai colar aqui os extratos da conta e do cartão para lançamento automático.</div>`;
}
function setEntrada(m,marca,val){const L=ensureMonth(m);let e=(L.entradas||[]).find(x=>x.marca===marca);if(!e){e={marca,valor:0};L.entradas.push(e);}e.valor=parseFloat(val)||0;liveTotals(m);changed();}
function setSaida(m,cat,item,val){const L=ensureMonth(m);let s=(L.saidas||[]).find(x=>x.cat===cat&&x.item===item);const v=parseFloat(val)||0;if(!s){if(v===0)return;s={cat,item,valor:0};L.saidas.push(s);}s.valor=v;liveTotals(m);changed();}
function setField(m,f,val){const L=ensureMonth(m);L[f]=parseFloat(val)||0;liveTotals(m);changed();}
function addMarca(m){const inp=document.getElementById("newMarca");const v=(inp.value||"").trim().toUpperCase();if(!v)return;const L=ensureMonth(m);if(!(L.entradas||[]).some(e=>e.marca===v))L.entradas.push({marca:v,valor:0});changed();renderLanc();}
let ltTimer=null;
function liveTotals(m){clearTimeout(ltTimer);ltTimer=setTimeout(()=>{if(view==="lanc"){updateResumo(m);}},250);}
function updateResumo(m){const L=DB.meses[m];if(!L)return;const com=(L.entradas||[]).reduce((s,e)=>s+(+e.valor||0),0);let cr=0;(L.saidas||[]).forEach(s=>cr+=(+s.valor||0));const pro=+L.prolabore||0,si=+L.saldo_inicial||0;const box=document.querySelector("#v-lanc .resumo");if(box)box.innerHTML=`
    <div class="rr"><span>Comissões</span><span class="mono">R$ ${fmt(com)}</span></div>
    <div class="rr"><span>Saldo inicial</span><span class="mono">R$ ${fmt(si)}</span></div>
    <div class="rr"><span>(−) Custo real</span><span class="mono">R$ ${fmt(cr)}</span></div>
    <div class="rr"><span>(−) Pró-labore</span><span class="mono">R$ ${fmt(pro)}</span></div>
    <div class="rr big"><span>Lucro (LPA)</span><span class="g mono">R$ ${fmt(com-cr)}</span></div>
    <div class="rr big"><span>Em caixa</span><span class="mono">R$ ${fmt(com+si-cr-pro)}</span></div>`;}

/* ================= TABELA MENSAL ================= */
function renderTab(){
  const el=document.getElementById("v-tab");
  const months=allMonths().slice().reverse();
  let rows=months.map(m=>{const a=aggFor(m);return `<tr>
    <td>${mLabel(m)}</td><td class="mono">${fmt0(a.com)}</td><td class="mono">${fmt0(a.fixo)}</td>
    <td class="mono">${fmt0(a.var)}</td><td class="mono">${fmt0(a.imp)}</td><td class="mono">${fmt0(a.custoReal)}</td>
    <td class="mono">${fmt0(a.pro)}</td><td class="mono">${fmt0(a.pro*0.6)}</td><td class="mono">${fmt0(a.pro*0.4)}</td><td class="mono pos">${fmt0(a.lpa)}</td><td class="mono">${a.com?(a.lpa/a.com*100).toFixed(0):0}%</td></tr>`;}).join("");
  el.innerHTML=`<div class="panel" style="overflow:auto"><h3>Resumo mês a mês (histórico + lançamentos)</h3>
    <table><thead><tr><th>Mês</th><th>Comissões</th><th>Fixo</th><th>Variável</th><th>Impostos</th><th>Custo real</th><th>Pró-labore</th><th>Chris 60%</th><th>Val 40%</th><th>LPA</th><th>Margem</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

/* ================= view switch ================= */
function setView(v){view=v;document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.v===v));
  ["dash","lanc","tab"].forEach(x=>document.getElementById("v-"+x).style.display=x===v?"block":"none");
  if(v==="dash")renderDash();else if(v==="lanc")renderLanc();else renderTab();}

/* ---------- persistência / sync (Firebase Realtime DB, sem token) ---------- */
let API_ON=false,pushTimer=null,pushing=false,dirty=false,lastStamp=0,pollTimer=null;
function setSync(x){const b=document.getElementById("syncBadge");if(!b)return;b.className="syncbadge "+(x||"");b.textContent=x==="ok"?"sincronizado":x==="saving"?"salvando...":x==="off"?"offline (local)":x==="err"?"erro":"•";}
function saveLocal(){try{localStorage.setItem(STORE_KEY,JSON.stringify(DB));}catch(e){}}
function changed(){DB.updated_at=Date.now();saveLocal();schedulePush();}
function schedulePush(){dirty=true;setSync("saving");clearTimeout(pushTimer);pushTimer=setTimeout(pushToServer,700);}
async function fbGet(){const r=await fetch(FB_URL+".json");if(!r.ok)throw new Error("get");const o=await r.json();return (o&&typeof o==="object"&&!o.error)?o:null;}
async function pushToServer(){if(pushing){schedulePush();return;}pushing=true;try{const r=await fetch(FB_URL+".json",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(DB)});if(!r.ok)throw new Error("put");lastStamp=DB.updated_at;dirty=false;API_ON=true;setSync("ok");}catch(e){API_ON=false;setSync("err");}finally{pushing=false;}}
function startPolling(){if(pollTimer)return;pollTimer=setInterval(async()=>{if(pushing||dirty)return;const ae=document.activeElement;if(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName))return;try{const d=await fbGet();if(d&&d.updated_at&&d.updated_at!==lastStamp&&(d.updated_at>=(DB.updated_at||0))){DB=migrate(d);lastStamp=d.updated_at;saveLocal();setView(view);setSync("ok");}}catch(e){setSync("off");}},15000);}
async function initSync(){try{const d=await fbGet();API_ON=true;if(d&&d.meses&&((d.updated_at||0)>=(DB.updated_at||0))){DB=migrate(d);lastStamp=d.updated_at||0;saveLocal();setView(view);}else{await pushToServer();}setSync("ok");startPolling();}catch(e){API_ON=false;setSync("off");startPolling();}}

/* ---------- boot ---------- */
function boot(){try{const raw=localStorage.getItem(STORE_KEY);if(raw)DB=migrate(JSON.parse(raw));}catch(e){}if(!DB)DB=blankDB();setView("dash");initSync();}
if(window.chrToken||sessionStorage.getItem("chr_pass"))boot();else window.addEventListener("chr-auth",boot,{once:true});
setTimeout(()=>{if(!DB)boot();},1200);
</script>
